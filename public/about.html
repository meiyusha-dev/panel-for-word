<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>機能詳細 — かんたんツールパネル for Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/icon-32.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── 新配色（ヘッダー/タブ/一覧/詳細） ── */
      --c-primary:      #2657D9;
      --c-primary-soft: #EDF1FC;
      --c-ink:          #14161A;
      --c-ink-70:       rgba(20,22,26,.72);
      --c-ink-60:       rgba(20,22,26,.60);
      --c-ink-55:       rgba(20,22,26,.55);
      --c-ink-45:       rgba(20,22,26,.45);
      --c-ink-40:       rgba(20,22,26,.40);
      --c-ink-12:       rgba(20,22,26,.12);
      --c-ink-10:       rgba(20,22,26,.10);
      --c-ink-08:       rgba(20,22,26,.08);
      --dark-bg:        #161A20;
      --font-jp: 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', 'Hiragino Sans', sans-serif;

      /* ── 実アドインの配色（装飾内のミニタスクペインのみで使用） ── */
      --real-tabbar:      #1e4d8c;
      --real-tab-inactive: #7fb5e8;
      --real-tab-active-bg: #f5f9ff;
      --real-tab-active-text: #0c51a0;
      --real-border:  #c5dcf5;
      --real-label:   #0c3370;
    }

    body {
      font-family: var(--font-jp);
      font-size: 14px;
      color: var(--c-ink);
      background: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── ヘッダー ── */
    .app-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 32px;
      height: 52px;
      background: #0c51a0;
      border-bottom: 1px solid rgba(255,255,255,.14);
    }
    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .brand-name {
      font: 700 15px var(--font-jp);
      color: #fff;
      white-space: nowrap;
    }
    .brand-name span { font-weight: 400; color: rgba(255,255,255,.7); margin-left: 4px; }
    .app-nav { margin-left: auto; display: flex; gap: 4px; }
    .app-nav a {
      font: 500 13px var(--font-jp);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 4px;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .app-nav a:hover { background: rgba(255,255,255,.15); color: #fff; }
    .app-nav a.active { background: rgba(255,255,255,0.2); color: #fff; }

    /* ── ステージ（モニター装飾 + メインコンテンツ） ── */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    /* ── モニター装飾（panel-for-word-web の .mockup を流用） ── */
    .monitor {
      flex: none;
      align-self: center;
      width: 1000px;
      margin-left: -600px;
      margin-right: 250px;
      background: var(--dark-bg);
      padding: 14px 14px 10px;
      border-radius: 16px;
      box-shadow: 0 30px 70px -30px rgba(20,20,40,.35);
      pointer-events: none; /* ミニタスクペインだけ下で再度有効化 */
      transform: scale(1.25);
      transform-origin: left center;
    }
    .monitor-camera {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      margin: 0 auto 10px;
    }
    .monitor-screen {
      position: relative;
      width: 100%;
      aspect-ratio: 1920 / 1080;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }
    .monitor-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left top;
      display: block;
    }

    /* ミニタスクペイン（実配色をそのまま流用） */
    .mini-pane {
      position: absolute;
      top: 92px;
      right: 0;
      width: 178px;
      height: 443px;
      display: flex;
      flex-direction: column;
      background: var(--real-tab-active-bg);
      overflow: hidden;
      pointer-events: auto;
    }
    .mini-header {
      flex: none;
      display: flex;
      align-items: center;
      height: 20px;
      padding: 0 6px;
      background: var(--real-tabbar);
    }
    .mini-header span {
      font: 700 7px var(--font-jp);
      color: #fff;
      white-space: nowrap;
    }
    .mini-tabs {
      flex: none;
      display: flex;
      flex-wrap: nowrap;
      gap: 3px;
      padding: 6px 6px 0;
      margin-top: -1px;
      background: var(--real-tabbar);
    }
    .mini-tab {
      flex: 1;
      font: 600 6px var(--font-jp);
      padding: 2px 3px;
      white-space: nowrap;
      border: none;
      border-radius: 3px 3px 0 0;
      background: transparent;
      color: var(--real-tab-inactive);
      cursor: pointer;
      font-family: inherit;
    }
    .mini-tab.active { color: var(--real-tab-active-text); background: var(--real-tab-active-bg); }
    .mini-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 48px);
      align-content: start;
      gap: 5px;
      padding: 6px;
    }
    .mini-card {
      width: 48px;
      height: 43px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 4px 2px;
      border: 1px solid var(--real-border);
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }
    .mini-card .swatch { display: flex; align-items: center; justify-content: center; color: var(--real-tabbar); }
    .mini-card .swatch svg { width: 13px; height: 13px; display: block; }
    .mini-card .lbl { font-size: 6px; line-height: 1.15; text-align: center; color: var(--real-label); word-break: keep-all; }
    .mini-card.active { background: var(--real-tabbar); border-color: var(--real-tabbar); }
    .mini-card.active .swatch { color: #fff; }
    .mini-card.active .lbl { color: #fff; }

    @media (max-width: 1320px) { .monitor { display: none; } }

    /* ── メインコンテンツ ── */
    .content {
      flex: 1;
      min-width: 0;
      display: flex;
      padding: 0 36px 0 16px;
      gap: 24px;
    }

    .tab-rail {
      flex: none;
      width: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      padding: 22px 4px;
      overflow-y: auto;
    }
    .tab-pill {
      font: 600 12.5px var(--font-jp);
      text-align: left;
      border: none;
      background: transparent;
      color: var(--c-ink-55);
      border-radius: 10px;
      padding: 9px 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .tab-pill:hover { background: var(--c-primary-soft); }
    .tab-pill.active { background: var(--c-primary); color: #fff; }

    .feature-list-col {
      flex: 1;
      min-width: 260px;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      padding: 22px 0;
      min-height: 0;
    }
    .feature-list-col__head h1 { font: 700 18px var(--font-jp); color: var(--c-ink); margin-bottom: 4px; }
    .feature-list-col__head p { font: 400 13px var(--font-jp); color: var(--c-ink-55); line-height: 1.7; margin-bottom: 12px; }
    .feature-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-top: 1px solid var(--c-ink-08);
      padding-top: 8px;
    }
    .feature-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 9px 12px;
      border-left: 3px solid transparent;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      outline: none;
    }
    .feature-row:hover { background: var(--c-primary-soft); }
    .feature-row .label { font: 600 12.5px var(--font-jp); color: var(--c-ink); }
    .feature-row .desc { font: 400 11.5px var(--font-jp); color: var(--c-ink-55); line-height: 1.5; }
    .feature-row.active { background: var(--c-primary-soft); border-left-color: var(--c-primary); }
    .feature-row.active .label { font-weight: 700; }
    .feature-row.active .desc { color: var(--c-ink-70); }
    .feature-row:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }

    .detail-col {
      flex: 1;
      min-width: 420px;
      padding: 22px 0 22px 26px;
      border-left: 1px solid var(--c-ink-08);
      overflow-y: auto;
    }
    .detail-col .eyebrow { font: 700 12px var(--font-jp); color: var(--c-primary); letter-spacing: .03em; }
    .detail-col h2 { font: 700 24px var(--font-jp); color: var(--c-ink); margin: 8px 0 12px; }
    .detail-desc { font: 400 14px var(--font-jp); color: var(--c-ink-70); line-height: 1.85; margin-bottom: 4px; }
    .detail-desc p { margin-bottom: 10px; }
    .detail-desc strong { color: var(--c-primary); }
    .detail-img { width: 100%; border-radius: 8px; border: 1px solid var(--c-ink-10); display: block; margin: 10px 0; cursor: zoom-in; }
    .detail-imgs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0; }
    .detail-imgs .detail-img { margin: 0; }
    .img-zoom-preview {
      position: fixed;
      z-index: 1000;
      border-radius: 8px;
      border: 1px solid var(--c-ink-10);
      box-shadow: 0 12px 32px rgba(20,20,40,.25);
      pointer-events: none;
      opacity: 0;
      transform: scale(.96);
      transition: opacity .15s ease, transform .15s ease;
      object-fit: cover;
    }
    .img-zoom-preview.show { opacity: 1; transform: scale(1); }
    .detail-img-fallback {
      height: 160px;
      border-radius: 8px;
      border: 1px solid var(--c-ink-10);
      background: repeating-linear-gradient(135deg,#EEF0F4,#EEF0F4 10px,#E4E7ED 10px,#E4E7ED 20px);
      margin: 10px 0;
    }

    /* ── フッター ── */
    .app-footer {
      flex: none;
      display: flex;
      align-items: center;
      padding: 10px 32px;
      background: #fff;
      border-top: 1px solid var(--c-ink-10);
    }
    .app-footer span { font: 400 11px var(--font-jp); color: var(--c-ink-45); }

    /* ── レスポンシブ ── */
    @media (max-width: 860px) {
      body { height: auto; overflow: visible; }
      .stage { overflow: visible; }
      .content { flex-direction: column; padding: 0 20px; }
      .tab-rail { flex-direction: row; flex-wrap: wrap; width: auto; }
      .detail-col { width: 100%; min-width: 0; border-left: none; border-top: 1px solid var(--c-ink-08); padding: 22px 0; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <img src="images/icon-32.png" alt="" class="brand-badge">
  <div class="brand-name">かんたんツールパネル<span>for Word</span></div>
  <nav class="app-nav">
    <a href="about.html" class="active">機能詳細</a>
    <a href="support.html">アドインについて</a>
  </nav>
</header>

<div class="stage">
  <div class="monitor" aria-hidden="true">
    <span class="monitor-camera"></span>
    <div class="monitor-screen">
      <img src="images/panel-screenshot.png" alt="">
      <div class="mini-pane">
        <div class="mini-header"><span>かんたんツールパネル</span></div>
        <div class="mini-tabs" id="miniTabs"></div>
        <div class="mini-grid" id="miniGrid"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <nav class="tab-rail" id="tabRail"></nav>

    <section class="feature-list-col">
      <div class="feature-list-col__head">
        <h1 id="tabTitle"></h1>
        <p id="tabDesc"></p>
      </div>
      <div class="feature-list" id="featureList"></div>
    </section>

    <aside class="detail-col" id="detailCol"></aside>
  </div>
</div>

<footer class="app-footer">
  <span>© 株式会社明友社</span>
</footer>

<img id="imgZoomPreview" class="img-zoom-preview" alt="">

// ─── 状態 ────────────────────────────────────────────────────────────────────
let currentTab = 'basic'
let currentFeatureId = null

// ─── 共通ヘルパー ──────────────────────────────────────────────────────────────
function handleImgError(img) {
  const fallback = document.createElement('div')
  fallback.className = 'detail-img-fallback'
  img.replaceWith(fallback)
}

// ─── レンダリング ─────────────────────────────────────────────────────────────
function currentFeatures() {
  return FEATURES.filter(f => f.tabId === currentTab)
}

function renderTabs(containerId, className, extraAttrs = '') {
  const el = document.getElementById(containerId)
  el.innerHTML = TABS.map(t =>
    `<button class="${className}${t.id === currentTab ? ' active' : ''}" data-tab="${t.id}"${extraAttrs}>${t.label}</button>`
  ).join('')
  el.querySelectorAll(`.${className}`).forEach(btn => {
    btn.addEventListener('click', () => selectTab(btn.dataset.tab))
  })
}

function renderTabRail() {
  renderTabs('tabRail', 'tab-pill')
}

function renderMiniTabs() {
  renderTabs('miniTabs', 'mini-tab', ' tabindex="-1"')
}

function renderFeatureList() {
  const tab = TABS.find(t => t.id === currentTab)
  document.getElementById('tabTitle').textContent = tab ? tab.label : ''
  document.getElementById('tabDesc').textContent = tab ? tab.desc : ''

  const list = document.getElementById('featureList')
  list.innerHTML = currentFeatures().map(f => `
    <div class="feature-row${currentFeatureId === f.id ? ' active' : ''}" data-id="${f.id}" tabindex="0" role="button" aria-label="${f.label}">
      <span class="label">${f.label}</span>
      <span class="desc">${f.listDesc}</span>
    </div>`).join('')
  list.querySelectorAll('.feature-row').forEach(row => {
    row.addEventListener('click', () => selectFeature(row.dataset.id))
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFeature(row.dataset.id) }
    })
  })
}

function renderMiniGrid() {
  const grid = document.getElementById('miniGrid')
  grid.innerHTML = currentFeatures().map(f => `
    <div class="mini-card${currentFeatureId === f.id ? ' active' : ''}" data-id="${f.id}" tabindex="-1">
      <span class="swatch">${f.icon}</span>
      <span class="lbl">${f.label}</span>
    </div>`).join('')
  grid.querySelectorAll('.mini-card').forEach(card => {
    card.addEventListener('click', () => selectFeature(card.dataset.id))
  })
}

function renderDetail(id) {
  const feature = FEATURES.find(f => f.id === id)
  if (!feature) return
  const tab = TABS.find(t => t.id === feature.tabId)

  const imgsInner = feature.imgs.map(src =>
    `<img src="${src}" alt="${feature.label}" class="detail-img" onerror="handleImgError(this)">`
  ).join('')
  const imgsHtml = `<div class="detail-imgs">${imgsInner}</div>`

  const col = document.getElementById('detailCol')
  col.scrollTop = 0
  col.innerHTML = `
    <div class="eyebrow">${tab ? tab.label : ''}</div>
    <h2>${feature.label}</h2>
    <div class="detail-desc">${feature.desc}</div>
    ${imgsHtml}
  `
}

function selectTab(tabId) {
  currentTab = tabId
  currentFeatureId = null
  renderTabRail()
  renderMiniTabs()
  renderFeatureList()
  renderMiniGrid()
  const first = FEATURES.find(f => f.tabId === currentTab)
  if (first) selectFeature(first.id)
}

function selectFeature(id) {
  currentFeatureId = id
  document.querySelectorAll('.feature-row').forEach(el => el.classList.toggle('active', el.dataset.id === id))
  document.querySelectorAll('.mini-card').forEach(el => el.classList.toggle('active', el.dataset.id === id))
  renderDetail(id)
}

// ─── 画像ホバー拡大プレビュー ───────────────────────────────────────────────────
let zoomTimer = null
const zoomPreview = document.getElementById('imgZoomPreview')

function showZoom(img) {
  const rect = img.getBoundingClientRect()
  const scale = 1.5
  const w = rect.width * scale
  const h = rect.height * scale
  const margin = 8
  let left = rect.left - (w - rect.width) / 2
  let top = rect.top
  if (left < margin) left = margin
  if (left + w > window.innerWidth - margin) left = window.innerWidth - margin - w
  if (top + h > window.innerHeight - margin) top = window.innerHeight - margin - h
  if (top < margin) top = margin
  zoomPreview.src = img.src
  zoomPreview.style.left = `${left}px`
  zoomPreview.style.top = `${top}px`
  zoomPreview.style.width = `${w}px`
  zoomPreview.style.height = `${h}px`
  zoomPreview.classList.add('show')
}

function hideZoom() {
  zoomPreview.classList.remove('show')
}

document.addEventListener('mouseover', (e) => {
  const img = e.target.closest('.detail-img')
  if (!img) return
  clearTimeout(zoomTimer)
  zoomTimer = setTimeout(() => showZoom(img), 400)
})
document.addEventListener('mouseout', (e) => {
  const img = e.target.closest('.detail-img')
  if (!img) return
  clearTimeout(zoomTimer)
  hideZoom()
})

// ─── 初期化 ──────────────────────────────────────────────────────────────────
renderTabRail()
renderMiniTabs()
renderFeatureList()
renderMiniGrid()
const firstFeature = FEATURES.find(f => f.tabId === currentTab)
if (firstFeature) selectFeature(firstFeature.id)
</script>
