<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>機能詳細 — かんたんツールパネル for Word</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #f0f4fa;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── ヘッダー ── */
    header {
      background: #0c51a0;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 52px;
      flex-shrink: 0;
      gap: 16px;
    }
    .logo {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    .logo-sub {
      font-size: 11px;
      opacity: 0.7;
      font-weight: 400;
    }
    header nav {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    header nav a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    header nav a:hover { background: rgba(255,255,255,0.15); color: #fff; }
    header nav a.active {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* ── メインレイアウト ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ── 左ペイン ── */
    .left-pane {
      width: 296px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #c5dcf5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* タブバー */
    .tab-bar {
      display: flex;
      background: #0c51a0;
      flex-shrink: 0;
      overflow-x: auto;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      min-width: 40px;
      padding: 10px 4px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: rgba(255,255,255,0.7);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #fff; border-bottom-color: #fff; }

    /* 左ペインコンテンツ */
    .left-pane-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }
    .left-pane-content::-webkit-scrollbar { width: 6px; }
    .left-pane-content::-webkit-scrollbar-thumb { background: #c5dcf5; border-radius: 3px; }

    /* カードグリッド */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
    }

    .feature-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 72px;
      border-radius: 6px;
      cursor: pointer;
      gap: 5px;
      border: 1px solid #c5dcf5;
      background: #fff;
      transition: background 0.15s, transform 0.12s, box-shadow 0.12s;
      padding: 6px 4px;
      user-select: none;
      outline: none;
    }
    .feature-card:hover {
      background: #e8f0fb;
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(30,77,140,0.15);
    }
    .feature-card:focus-visible {
      outline: 2px solid #1e4d8c;
      outline-offset: 2px;
    }
    .feature-card.active {
      background: #0c51a0;
      border-color: #0c51a0;
      transform: none;
      box-shadow: 0 2px 6px rgba(12,81,160,0.4);
    }
    .feature-card.active .card-icon { color: #fff; }
    .feature-card.active .card-label { color: #fff; }

    .card-icon {
      color: #1e4d8c;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      flex-shrink: 0;
    }
    .card-label {
      font-size: 10.5px;
      text-align: center;
      color: #0c3370;
      line-height: 1.2;
      word-break: keep-all;
    }

    /* お気に入りタブ左ペイン */
    .favorites-text {
      padding: 16px 14px;
      font-size: 13px;
      line-height: 1.75;
      color: #333;
    }
    .favorites-text h3 {
      font-size: 13px;
      font-weight: 700;
      color: #0c51a0;
      margin-bottom: 10px;
    }
    .favorites-text p { margin-bottom: 8px; }
    .favorites-text ul { padding-left: 1.4em; }
    .favorites-text li { margin-bottom: 5px; }

    /* ── 右ペイン ── */
    .right-pane {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 28px 36px;
      background: #f8fafd;
    }
    .right-pane::-webkit-scrollbar { width: 8px; }
    .right-pane::-webkit-scrollbar-thumb { background: #c5dcf5; border-radius: 4px; }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #c5dcf5;
    }
    .detail-icon {
      width: 48px;
      height: 48px;
      background: #0c51a0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .detail-title {
      font-size: 20px;
      font-weight: 700;
      color: #0c3370;
    }
    .detail-desc {
      font-size: 14px;
      line-height: 1.85;
      color: #333;
      margin-bottom: 16px;
    }
    .detail-desc p { margin-bottom: 10px; }
    .detail-desc strong { color: #0c51a0; }
    .detail-img {
      width: 100%;
      max-width: 560px;
      border: 1px solid #ddd;
      border-radius: 6px;
      display: block;
      margin: 8px 0 16px;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: #8aadcc;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

// ─── 状態 ────────────────────────────────────────────────────────────────────
let currentTab = 'basic'
let currentFeatureId = null

// ─── レンダリング ─────────────────────────────────────────────────────────────
function renderTabs() {
  const tabBar = document.getElementById('tabBar')
  tabBar.innerHTML = TABS.map(t =>
    `<button class="tab-btn${t.id === currentTab ? ' active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('')
  tabBar.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab
      currentFeatureId = null
      renderTabs()
      renderLeft()
      if (currentTab !== 'favorites') {
        const first = FEATURES.find(f => f.tabId === currentTab)
        if (first) selectFeature(first.id)
      } else {
        renderFavoritesRight()
      }
    })
  })
}

function renderLeft() {
  const el = document.getElementById('leftContent')
  if (currentTab === 'favorites') {
    el.innerHTML = `
      <div class="favorites-text">
        <h3>★ お気に入り機能</h3>
        <p>よく使う機能カードを「お気に入り」タブに追加することで、機能を探す手間を省けます。</p>
        <p>登録方法は2通りあります：</p>
        <ul>
          <li>各機能カード右上の <strong>★</strong> アイコンをクリック</li>
          <li>各機能カード内の「お気に入りに登録」ボタンをクリック</li>
        </ul>
        <p style="margin-top:8px;">お気に入りタブではドラッグ＆ドロップで並び順を変更できます。</p>
      </div>
    `
    return
  }
  const features = FEATURES.filter(f => f.tabId === currentTab)
  el.innerHTML = `<div class="card-grid">${features.map(f => `
    <div class="feature-card${currentFeatureId === f.id ? ' active' : ''}" data-id="${f.id}" tabindex="0" role="button" aria-label="${f.label}">
      <div class="card-icon">${f.icon}</div>
      <span class="card-label">${f.label}</span>
    </div>`).join('')}</div>`
  el.querySelectorAll('.feature-card').forEach(card => {
    card.addEventListener('click', () => selectFeature(card.dataset.id))
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFeature(card.dataset.id) }
    })
  })
}

function selectFeature(id) {
  currentFeatureId = id
  const feature = FEATURES.find(f => f.id === id)
  if (!feature) return

  document.querySelectorAll('.feature-card').forEach(c => {
    c.classList.toggle('active', c.dataset.id === id)
  })

  const imgsHtml = feature.imgs.map(src =>
    `<img src="${src}" alt="${feature.label}" class="detail-img" onerror="this.style.display='none'">`
  ).join('')

  const right = document.getElementById('rightPane')
  right.scrollTop = 0
  right.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon">${feature.icon}</div>
      <h2 class="detail-title">${feature.label}</h2>
    </div>
    <div class="detail-desc">${feature.desc}</div>
    ${imgsHtml}
  `
}

function renderFavoritesRight() {
  const right = document.getElementById('rightPane')
  right.scrollTop = 0
  right.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon" style="font-size:24px;">★</div>
      <h2 class="detail-title">お気に入りの使い方</h2>
    </div>
    <div class="detail-desc">
      <p>よく使う機能を素早くアクセスできるようにする機能です。</p>
      <p><strong>登録方法①</strong>：各機能カード右上の ★ アイコンをクリック</p>
    </div>
    <img src="images/favorites-1.png" alt="お気に入り登録①" class="detail-img" onerror="this.style.display='none'">
    <div class="detail-desc" style="margin-top:8px;">
      <p><strong>登録方法②</strong>：各機能カード内の「お気に入りに登録」ボタンをクリック</p>
    </div>
    <img src="images/favorites-2.png" alt="お気に入り登録②" class="detail-img" onerror="this.style.display='none'">
  `
}

// ─── 初期化 ──────────────────────────────────────────────────────────────────
renderTabs()
renderLeft()
const firstFeature = FEATURES.find(f => f.tabId === currentTab)
if (firstFeature) selectFeature(firstFeature.id)
</script>
